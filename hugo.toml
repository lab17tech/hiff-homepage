baseURL = '/'
languageCode = 'no-nb'
title = 'Haugerud IF - Fotball'
theme = 'main-theme'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Haugerud Idrettsforening - Fotballgruppa"
  tagline = "Setter hele nærmiljøet i bevegelse"
  established = 1970

  # Fee structure for 2025
  [params.fees]
    membership = 350  # Medlemskontingent per year

    [[params.fees.football]]
      category = "Barnefotball"
      ageRange = "5-9 år"
      amount = 1800

    [[params.fees.football]]
      category = "Eldre barnefotball"
      ageRange = "10-12 år"
      amount = 1900

    [[params.fees.football]]
      category = "Ungdomsfotball"
      ageRange = "13-17 år"
      amount = 2200

    [[params.fees.football]]
      category = "Voksenfotball"
      ageRange = "JR-lag og Seniorlag"
      amount = 2500

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
